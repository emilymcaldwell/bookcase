<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so env(safe-area-inset-bottom) reports, which --space-safe-bottom reads. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookcase</title>
<script>try{var s=localStorage.getItem('ds-scheme');if(s==='light'||s==='dark')document.documentElement.setAttribute('data-theme',s)}catch(e){}</script>
<link rel="stylesheet" href="design/system/tokens.css">
<link rel="stylesheet" href="design/system/components/bundle.css">
<link rel="stylesheet" href="app/shelf.css">
<script src="design/system/components/bundle.js" defer></script>
<script src="app/shelf.js" defer></script>
</head>
<body class="ds-app">

<div class="app" id="app">

  <div class="app__brand">
    <h1 class="h2 app__wordmark">Bookcase</h1>
  </div>

  <div class="app__bar">
    <label class="sr-only" for="search">Search your library</label>
    <div class="app__search">
      <input
        class="field-input search__input"
        id="search"
        type="search"
        autocomplete="off"
        placeholder="Search by title or author">
      <button class="btn btn--ghost icon-btn search__clear" type="button"
              data-action="search-clear" data-icon="close" aria-label="Clear search" hidden></button>
    </div>

    <div class="app__actions">
      <button class="btn btn--ghost icon-btn app__search-open" type="button"
              data-action="search-open" data-icon="search" aria-label="Search"></button>
      <button class="btn btn--ghost icon-btn" type="button" id="sort-button"
              data-action="sort" data-icon="sort" aria-label="Sort"
              aria-haspopup="true" aria-expanded="false"></button>
      <button class="btn btn--ghost icon-btn" type="button"
              data-action="cloud" data-icon="cloud" aria-label="Cloud settings"></button>
      <span class="app__rule" aria-hidden="true"></span>
      <button class="theme-toggle theme-toggle--icon icon-btn" type="button" data-ds-theme-toggle></button>
    </div>

    <button class="btn btn--ghost app__search-cancel" type="button" data-action="search-cancel">Cancel</button>
  </div>

  <div class="app__side">
    <div class="app__side-inner">
      <nav class="nav" aria-label="Filters" id="filters"></nav>
      <button class="btn btn--primary app__add" type="button" data-action="add" data-icon="plus">Add book</button>
    </div>
  </div>

  <div class="app__chips">
    <div class="chips" role="group" aria-label="Filters" id="chips"></div>
  </div>

  <main class="app__content" id="content"></main>

  <button class="btn btn--primary fab" type="button" data-action="add" data-icon="plus" aria-label="Add book"></button>

</div>

<div id="overlay-root"></div>

</body>
</html>
